# ============================================================================
#  BIOS/isolinux 菜单(build.sh 会把 __LABEL__ 换成实际光盘卷标)
#  Auto = 零输入全自动;Select = 手动选网络类型 / 网卡 / 磁盘
# ============================================================================
default vesamenu.c32
timeout  300

display boot.msg

menu clear
menu background splash.png
menu title     __MENU_TITLE__
menu vshift 8
menu rows 18
menu margin 8
menu helpmsgrow 15
menu tabmsgrow 13

# Border Area
menu color border * #00000000 #00000000 none

# Selected item
menu color sel 0 #ffffffff #00000000 none

# Title bar
menu color title 0 #ff7ba3d0 #00000000 none

# Press [Tab] message
menu color tabmsg 0 #ff3a6496 #00000000 none

# Unselected menu item
menu color unsel 0 #84b8ffff #00000000 none

# Selected hotkey
menu color hotsel 0 #84b8ffff #00000000 none

# Unselected hotkey
menu color hotkey 0 #ffffffff #00000000 none

# Help text
menu color help 0 #ffffffff #00000000 none

# A scrollbar of some type? Not sure.
menu color scrollbar 0 #ffffffff #ff355594 none

# Timeout msg
menu color timeout 0 #ffffffff #00000000 none
menu color timeout_msg 0 #ffffffff #00000000 none

# Command prompt text
menu color cmdmark 0 #84b8ffff #00000000 none
menu color cmdline 0 #ffffffff #00000000 none

menu tabmsg Press Tab for full configuration options on menu items.

menu separator # insert an empty line
menu separator # insert an empty line

# ---------------------------------------------------------------------------
# 1) 全自动:自动选盘 → GPT 分区 → 装包 → %post 配置 → reboot --eject
# ---------------------------------------------------------------------------
label Auto-install
  menu default
  menu label ^Auto Install (zero-touch)
  kernel /images/pxeboot/vmlinuz
  append initrd=/images/pxeboot/initrd.img  inst.ks=hd:LABEL=__LABEL__:/isolinux/ks.cfg  inst.stage2=hd:LABEL=__LABEL__  auto inst.gpt  rd.lvm=0  rd.md=0 rd.dm=0 inst.nosave=all_ks

# ---------------------------------------------------------------------------
# 2) 手动:选网络类型(dhcp-auto / dhcp-select / static)→ 选网卡 → 选磁盘
# ---------------------------------------------------------------------------
label Select network/disk
  menu label ^Select Install (manual: network + disk)
  kernel /images/pxeboot/vmlinuz
  append initrd=/images/pxeboot/initrd.img inst.stage2=hd:LABEL=__LABEL__ inst.ks=hd:LABEL=__LABEL__:/isolinux/ks.cfg static  inst.gpt  rd.lvm=0  rd.md=0 rd.dm=0 console=tty0 inst.nosave=all_ks

menu end
