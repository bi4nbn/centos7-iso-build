text
skipx
firstboot --enable
keyboard --vckeymap=cn --xlayouts='cn'
#lang zh_CN.UTF-8
selinux --disabled
cdrom

auth --enableshadow --passalgo=sha512
rootpw --iscrypted __ROOTPW_HASH__
services  --enabled="network,chronyd"
timezone  Asia/Shanghai --nontp
reboot --eject


%include /tmp/other.ks

%packages
@^minimal
@core
# grubby:内核包自己的 %post 要调用 /sbin/new-kernel-pkg(由 grubby 提供)生成 initramfs、
# 写 grub 条目;缺了它 anaconda 会在收尾阶段(Generating initramfs)直接失败。
grubby
# 说明:装机环境没有外网,这里列出的包必须真的在 ISO 的 Packages/ 里。
chrony
# ---------------------------------------------------------------------------
# 以下为"可选包"区:build.sh 会逐个检查 Packages/ 里有没有,没有就自动注释掉
# (官方 Minimal 盘里没有 kernel-headers / wget,这样写才不会让 anaconda 直接报错)
# __OPT_PKGS_BEGIN__
kernel-headers
wget
# __OPT_PKGS_END__
# ---------------------------------------------------------------------------
# 双内核区:只有 build.sh 传了 --kernel-rpm(例如 5.4 内核)时才会被填上
# "再装一份官方 3.10 内核"的显式包名,让两个内核并存、默认走版本更高的那个。
# __DUAL_KERNEL_BEGIN__
# __DUAL_KERNEL_END__
%end

%pre --log=/root/ks-pre.log
rm -f /tmp/other.ks
touch /tmp/other.ks
# 候选盘:整盘 + 物理白名单 - 可移动/USB安装介质/Ventoy 盘(避免把系统装进装机 U 盘)
_alldisk_raw=$(lsblk -ldno name,size,type|awk '$3=="disk" && $1 ~ /^(sd[a-z]+|hd[a-z]+|vd[a-z]+|xvd[a-z]+|nvme[0-9]+n[0-9]+|cciss!c[0-9]+d[0-9]+)$/{print $1,$2}')
alldisk=""
for _pair in $_alldisk_raw; do
_d=${_pair%% *}
# ① 可移动设备(U 盘/移动硬盘)
[ "$(cat /sys/block/$_d/removable 2>/dev/null)" = "1" ] && { echo "[pre] skip $_d: removable" >&2; continue; }
# ② USB 总线上的盘
readlink -f "/sys/block/$_d" 2>/dev/null | grep -q '/usb' && { echo "[pre] skip $_d: usb bus" >&2; continue; }
# ③ Ventoy 盘(分区标签 VTOYEFI / Ventoy)
if lsblk -lno name,label "/dev/$_d" 2>/dev/null | awk 'tolower($2) ~ /vtoy|ventoy/{f=1} END{exit !f}'; then
echo "[pre] skip $_d: ventoy media" >&2; continue
fi
alldisk="$alldisk $_pair"
done
# 必须保持"名字 容量"成对再编号(xargs -n2),否则 sda/60G 会被拆成两行,编号选盘永远选不中
alldisk=$(echo $alldisk | xargs -n2 | cat -n)
if grep -q static /proc/cmdline; then
	curTTY=$(tty)
	exec < $curTTY > $curTTY 2> $curTTY
	clear

	echo -e "******************************* Please select network type ***********************************
	\t1)dhcp-auto
	\t2)dhcp-select
	\t3)static"
	read -t 60 -p "Your select (1 or 2,3)          : " INPUT


	case $INPUT in
		3)
			echo "******************************* Please select interface name *********************************"
			# 带编号列出物理网卡(与磁盘选择一致:编号或名字都能选)
			_iflist=$(ip -br link | grep -v LOOPBACK | awk '{print $1}' | cat -n)
			while read -r _n _dev _rest; do
				[ -z "$_dev" ] && continue
				_line=$(ip -br link show "$_dev" 2>/dev/null | awk '{print $1, $2, $3}')
				_spd=$(ethtool "$_dev" 2>/dev/null | awk '/Speed:/{print $2}')
				printf "\t%s) %-12s %-20s Speed: %s\n" "$_n" "$_dev" "$(echo "$_line" | awk '{print $3}')" "${_spd:-?}"
			done <<EOF
$_iflist
EOF
			echo

			INTERFACE=""
			while [ -z "$INTERFACE" ]; do
				read -t 60 -p "select interface (number 1/2... or name ens192)  : " _sel
				_sel=$(echo "$_sel" | tr -d ' \t\r\n')
				case "$_sel" in
					*[!0-9]*) _cand="$_sel" ;;
					*)        _cand=$(echo "$_iflist" | awk -v n="$_sel" '$1==n{print $2}') ;;
				esac
				if [ -n "$_cand" ] && ip addr show "$_cand" >/dev/null 2>&1 && [ -d "/sys/class/net/$_cand" ]; then
					INTERFACE="$_cand"
					echo "  >>> interface selected: $_cand"
				else
					echo "  ** invalid \"$_sel\": type a number from the list above (1, 2, ...) or a NIC name (e.g. ens192) **"
				fi
			done

			ANSWER="n"
			while [ x"$ANSWER" != "xy" ] && [ x"$ANSWER" != "xY" ] ; do
			read -p "Enter IP Address      : " IPADDR
			read -p "Enter NetMask         : " NETMASK
			read -p "Enter Gateway         : " GATEWAY
			echo
			echo "You entered:"
			echo -e "\tIP Address: $IPADDR"
			echo -e "\tNetMask: $NETMASK"
			echo -e "\tGateway: $GATEWAY"
			echo -n "Is this correct? [y/n] "; read ANSWER
			done
			sleep 1
			read -p "Enter DNS (default 223.5.5.5)  : " DNS
			DNS=${DNS:-223.5.5.5}
			[ -n "$INTERFACE" ] && echo "$INTERFACE" > /run/.iface
			echo "network --bootproto=static --gateway=$GATEWAY --ip=$IPADDR --netmask=$NETMASK --nameserver=$DNS    --onboot=yes  ${INTERFACE:+--device=$INTERFACE}" >/tmp/other.ks
			;;
		2)
			echo "******************************* Please select interface name *********************************"
			# 带编号列出物理网卡(与磁盘选择一致:编号或名字都能选)
			_iflist=$(ip -br link | grep -v LOOPBACK | awk '{print $1}' | cat -n)
			while read -r _n _dev _rest; do
				[ -z "$_dev" ] && continue
				_line=$(ip -br link show "$_dev" 2>/dev/null | awk '{print $1, $2, $3}')
				_spd=$(ethtool "$_dev" 2>/dev/null | awk '/Speed:/{print $2}')
				printf "\t%s) %-12s %-20s Speed: %s\n" "$_n" "$_dev" "$(echo "$_line" | awk '{print $3}')" "${_spd:-?}"
			done <<EOF
$_iflist
EOF
			echo

			INTERFACE=""
			while [ -z "$INTERFACE" ]; do
				read -t 60 -p "select interface (number 1/2... or name ens192)  : " _sel
				_sel=$(echo "$_sel" | tr -d ' \t\r\n')
				case "$_sel" in
					*[!0-9]*) _cand="$_sel" ;;
					*)        _cand=$(echo "$_iflist" | awk -v n="$_sel" '$1==n{print $2}') ;;
				esac
				if [ -n "$_cand" ] && ip addr show "$_cand" >/dev/null 2>&1 && [ -d "/sys/class/net/$_cand" ]; then
					INTERFACE="$_cand"
					echo "  >>> interface selected: $_cand"
				else
					echo "  ** invalid \"$_sel\": type a number from the list above (1, 2, ...) or a NIC name (e.g. ens192) **"
				fi
			done
		    echo "Use dhcp ................."
		    [ -n "$INTERFACE" ] && echo "$INTERFACE" > /run/.iface
		    echo "network  --activate --onboot=yes     --bootproto=dhcp ${INTERFACE:+--device=$INTERFACE}" > /tmp/other.ks
			;;
		*)
		 echo "Use dhcp  auto................."
		 echo "network --activate --bootproto=dhcp --onboot=yes   "  >> /tmp/other.ks
	esac


	echo "******************************* Please select install disk **************************************"
# physical disks only: sd*/hd*/nvme*/cciss* ; excluded: zram/ram/loop/fd/sr/nbd/dm-/md, vd*/xvd*/mmcblk*/pmem*
if [ -z "$alldisk" ]; then
    echo "  NOTE: no physical disk matched; falling back to generic block devices (excluding ram/cd/floppy/loop)"
    alldisk=$(lsblk -ldno name,size,type|awk '$3=="disk" && $1 !~ /^(zram|ram|loop|fd|sr|nbd|dm-|md)/{print $1,$2}'|cat -n)
fi
if [ -z "$alldisk" ]; then
    clear
    echo "**************************************************************"
    echo " AUTO INSTALL ABORTED: no usable physical disk found"
    echo "**************************************************************"
    echo " block devices seen by the installer:"
    lsblk -o NAME,SIZE,TYPE,MODEL 2>/dev/null | sed "s/^/   /"
    echo
    echo " ничего не будет записано на диск. 请检查:硬盘/RAID 卡/线缆,"
    echo " 或改用 Select Install (manual) 手动选盘。"
    echo
    sleep 10
    exit 1
fi
# 白名单说明:只列真正的物理/虚拟整盘(sd*/hd*/vd*/xvd*/nvme*/mmcblk*/cciss*/pmem*)
# 排除 zram*(内存压缩盘)、sr*(光驱)、loop*、ram*、dm-*、md*、fd*(软驱)、nbd* 等不可安装设备
	echo "$alldisk"|awk '{printf "%-4s%-8s%4s\n", "\t"$1,$2,$3 }'
	echo "*************************************************************************************************"

	# ===== 选盘:输入编号(1/2/3...)或直接输入盘名(sda/sdb)=====
	# 列表已过滤软驱(fd*)等不可安装设备,因此"编号 → 真实盘名"是精确的一一对应;
	# 两种输入都接受,选完回显解析出的 /dev/XXX,不做任何默认兜底。
	DISK=""
	while [ -z "$DISK" ]; do
		read -t 60 -p "select disk (number 1/2/3... or name sda/sdb)  : " DISKSEL
		DISKSEL=$(echo "$DISKSEL" | tr -d ' \t\r\n')
		DISKSEL=${DISKSEL#/dev/}
		if [ -z "$DISKSEL" ]; then
			echo "  ** input required: type a NUMBER (1/2/3...) or a DISK NAME (sda/sdb) - no default **"
			continue
		fi
		# 全数字 → 当编号解析;否则当盘名
		case "$DISKSEL" in
			*[!0-9]*)
				CAND="$DISKSEL" ;;
			*)
				CAND=$(echo "$alldisk" | awk -v n="$DISKSEL" '$1==n{print $2}') ;;
		esac
		CAND_DEV=$(echo "$CAND" | tr '!' '/')
		if [ -n "$CAND" ] && echo "$alldisk" | awk -v d="$CAND" '$2==d{found=1} END{exit !found}' && [ -b "/dev/$CAND_DEV" ] && [ -d "/sys/block/$CAND" ]; then
			DISK="$CAND"
			echo "  >>> install disk selected: input=\"$DISKSEL\"  ->  device=/dev/$DISK"
		else
			echo "  ** invalid \"$DISKSEL\": type a number from the list above (e.g. 1, 2) or a disk name (e.g. sda, sdb) **"
		fi
	done
	echo $DISK > /run/.disk
	# ---- 释放目标盘上的占用(重装到已有系统的盘时的关键预处理)----
	# 现象:不释放时 parted 写分区表会 EBUSY,anaconda 报
	#   "Partition(s) N on /dev/X have been written, but we have been unable to
	#    inform the kernel of the change ... it/they are in use"
	swapoff -a 2>/dev/null || true
	vgchange -an 2>/dev/null || true
	dmsetup remove_all 2>/dev/null || true
	command -v mdadm >/dev/null 2>&1 && mdadm --stop --scan 2>/dev/null || true
	command -v multipath >/dev/null 2>&1 && multipath -F 2>/dev/null || true
	# 尝试卸载该盘上已挂载的分区(安装环境里通常没有,保险起见)
	for p in $(ls /dev/${DISK}[0-9]* 2>/dev/null); do umount -f "$p" 2>/dev/null || true; done
	udevadm settle 2>/dev/null || true
	echo "[pre] released existing holders on /dev/$DISK (swap/lvm/dm/md/multipath)"

	parted -s /dev/$DISK rm 1 >/dev/null 2>&1
	parted -s /dev/$DISK mklabel gpt >/dev/null 2>&1
	udevadm settle 2>/dev/null || true
	partprobe /dev/$DISK 2>/dev/null || true
	sleep 1
	echo bootloader --location=mbr --driveorder=$DISK --append="crashkernel=128M rhgb quiet" >> /tmp/other.ks
	echo ignoredisk --only-use=$DISK  >> /tmp/other.ks
    echo clearpart --all --initlabel --drives=$DISK >> /tmp/other.ks
    echo part /boot --fstype xfs --ondisk=$DISK  --size 1024 >> /tmp/other.ks
    echo part / --fstype xfs --ondisk=$DISK  --size 1 --grow >> /tmp/other.ks
	echo part /data --fstype xfs --ondisk=$DISK  --size 102400 >> /tmp/other.ks
	if [ -d /sys/firmware/efi ]; then
		echo part /boot/efi --fstype=efi --ondisk=$DISK --size=200 >> /tmp/other.ks
	else
		echo part biosboot  --fstype=biosboot --size=1 --ondisk=$DISK   >> /tmp/other.ks
	fi
	partprobe

fi

if grep -q auto /proc/cmdline; then
	# Auto 不再写死 sda:取候选盘(已排除可移动/USB/Ventoy)第一块
	# 选盘策略:排除可移动/USB/Ventoy 之后,取"容量 >= 110GiB 里最小的那块"
	# (CDN/存储机型上系统盘通常是最小那块 SSD,大容量盘是数据盘;不再写死 sda)
	MIN_BYTES=$((110*1024*1024*1024))
	DISK=""; _best=""
	for _n in $(echo "$alldisk" | awk '{print $2}'); do
	    [ -b "/dev/$_n" ] || continue
	    _sz=$(cat /sys/block/$_n/size 2>/dev/null) || continue
	    case "$_sz" in ''|*[!0-9]*) continue ;; esac
	    _bytes=$(( _sz * 512 ))
	    [ "$_bytes" -lt "$MIN_BYTES" ] && continue
	    if [ -z "$_best" ] || [ "$_bytes" -lt "$_best" ]; then _best=$_bytes; DISK=$_n; fi
	done
	if [ -z "$DISK" ]; then
	    clear
	    echo "**************************************************************"
	    echo " AUTO INSTALL ABORTED: no usable physical disk found"
	    echo "**************************************************************"
	    lsblk -o NAME,SIZE,TYPE,MODEL 2>/dev/null | sed "s/^/   /"
	    echo
	    echo " 可能所有盘都被判为可移动/U 盘/Ventoy 介质。请改用 Select Install (manual) 手动选盘。"
	    sleep 10; exit 1
	fi
	echo "[pre] auto target disk = /dev/$DISK  size=$(lsblk -dno size /dev/$DISK 2>/dev/null)  model=$(cat /sys/block/$DISK/device/model 2>/dev/null | tr -s ' ')  rotational=$(cat /sys/block/$DISK/queue/rotational 2>/dev/null)"
	# ---- 大字目标盘提示(零输入不变:5 秒后自动继续)----
	_rot=$(cat /sys/block/$DISK/queue/rotational 2>/dev/null)
	_kind=$([ "$_rot" = "0" ] && echo SSD || echo HDD)
	_sz=$(lsblk -dno size /dev/$DISK 2>/dev/null)
	_md=$(cat /sys/block/$DISK/device/model 2>/dev/null | tr -s ' ')
	clear
	echo "=================================================================="
	echo "   AUTO INSTALL - TARGET DISK"
	echo ""
	echo "     /dev/$DISK      $_sz   $_kind   $_md"
	echo ""
	echo "   ALL CANDIDATE DISKS:"
	for _x in $(echo "$alldisk" | awk '{print $2}'); do
	    _r=$(cat /sys/block/$_x/queue/rotational 2>/dev/null)
	    _k=$([ "$_r" = "0" ] && echo SSD || echo HDD)
	    printf "     %-10s %-8s %-4s %s\n" "$_x" "$(lsblk -dno size /dev/$_x 2>/dev/null)" "$_k" "$(cat /sys/block/$_x/device/model 2>/dev/null | tr -s ' ')"
	done
	echo ""
	echo "   ONLY /dev/$DISK WILL BE WIPED.  Installation starts in 5 seconds ..."
	echo "=================================================================="
	sleep 5
	echo bootloader --location=mbr --driveorder=$DISK --append="crashkernel=128M rhgb quiet" >> /tmp/other.ks
	parted -s /dev/$DISK rm 1 >/dev/null 2>&1
	parted -s /dev/$DISK mklabel gpt >/dev/null 2>&1
    echo ignoredisk --only-use=$DISK  >> /tmp/other.ks
    echo clearpart --all --initlabel --drives=$DISK >> /tmp/other.ks
    echo part /boot --fstype xfs --ondisk=$DISK --size 1024 >> /tmp/other.ks
	echo part /data --fstype xfs --ondisk=$DISK --size 102400 >> /tmp/other.ks
    echo part / --fstype xfs --ondisk=$DISK --size 1 --grow >> /tmp/other.ks
	if [ -d /sys/firmware/efi ]; then
		echo part /boot/efi --fstype=efi --ondisk=$DISK --size=200 >> /tmp/other.ks
	else
		echo part biosboot  --fstype=biosboot --size=1 --ondisk=$DISK   >> /tmp/other.ks
	fi
	echo $DISK > /run/.disk
	echo network --activate --bootproto=dhcp --onboot=yes     >> /tmp/other.ks
	partprobe
fi


# KS-SELFCHECK:若 /tmp/other.ks 为空(选盘/分支逻辑异常),直接打横幅退出,避免静默失败
if [ ! -s /tmp/other.ks ]; then
    clear
    echo "**************************************************************"
    echo " KICKSTART PRE-CHECK FAILED: /tmp/other.ks is EMPTY"
    echo "**************************************************************"
    echo " 选盘/分支逻辑没有产出任何分区或 bootloader 指令,安装无法继续。"
    echo " block devices:"; lsblk -o NAME,SIZE,TYPE,MODEL 2>/dev/null | sed "s/^/   /"
    echo " /tmp/other.ks 内容:"; cat -A /tmp/other.ks 2>/dev/null | head -5 | sed "s/^/   /"
    sleep 10
    exit 1
fi
echo "[pre] /tmp/other.ks lines: $(wc -l < /tmp/other.ks)"
%end

%post  --nochroot --log=/var/log/ks-post-nochroot.log
# 把 ISO 里的自定义载荷(files/)拷进目标机;files/ 不存在时不算失败
if [ -d /mnt/install/repo/files ]; then
    /bin/cp -rvpf /mnt/install/repo/files/.  /mnt/sysimage/ || true
else
    echo ">>> no /mnt/install/repo/files payload, skipped"
fi
# genisoimage -T 会在 ISO 的每个目录里生成 TRANS.TBL,拷过去是垃圾文件,清掉
# genisoimage -T 会在 ISO 的每个目录生成 TRANS.TBL,全部清掉(原来只删了 3 个,残留 8 个)
find /mnt/sysimage -name TRANS.TBL -delete 2>/dev/null || true
# 把 %pre 选中的安装盘名抄进目标机,给后面的"显式装 GRUB"%post 用
%end

%post  --log=/var/log/ks-post-rc-local.log

# ============ 网卡驱动参数:ixgbe 允许非原厂 SFP ============
# 原实现把 "modprobe -r ixgbe; modprobe ixgbe allow_unsupported_sfp=1" 追加到 rc.local。
# rc-local 在 multi-user 之后运行,那时 ixgbe 端口已经 up,`modprobe -r` 会因
# "module in use" 失败(rmmod r8169 同理),参数始终不生效。改写在 modprobe.d:
# 模块加载时就带上参数;anaconda 在本 %post 之后才生成 initramfs,dracut 会一并收进去。
mkdir -p /etc/modprobe.d
cat > /etc/modprobe.d/99-edge-ixgbe.conf <<'IXGBE'
# Allow unsupported (non-vendor) SFP modules - edge-node requirement
options ixgbe allow_unsupported_sfp=1
IXGBE
echo ">>> /etc/modprobe.d/99-edge-ixgbe.conf: $(cat /etc/modprobe.d/99-edge-ixgbe.conf)"

# rc.local:只保留一个**幂等**的兜底(不再用 modprobe -r/rmmod —— 那个阶段必然失败,
# 只会留下误导性的报错;真正的参数由上面的 modprobe.d 负责)
RC_LOCAL=/etc/rc.d/rc.local
[ -f "$RC_LOCAL" ] || printf '#!/bin/bash\n' > "$RC_LOCAL"
MARK="# linux-tty: ensure ixgbe allow_unsupported_sfp"
if ! grep -qF "$MARK" "$RC_LOCAL"; then
	{
		echo "$MARK"
		echo "modprobe ixgbe allow_unsupported_sfp=1 2>/dev/null || true"
		echo "modprobe r8169 2>/dev/null || true"
		echo "# /root must only contain disk.sh/test.sh/ip.sh (+ standard dotfiles)."
		echo "# anaconda writes /root/anaconda-ks.cfg AFTER %post (install.py: runPostScripts"
		echo "# then _writeKS), so the %post rm cannot catch it - this is the last net."
		echo "rm -f /root/anaconda-ks.cfg /root/original-ks.cfg 2>/dev/null || true"
	} >> "$RC_LOCAL"
fi

chmod +x  /etc/rc.local
chmod +x  /etc/rc.d/rc.local

%end

%post --log=/var/log/ks-post-console.log
# 原段在"移除串口"时被删断了 if/elif/fi 链(原文见 work/ks-console-post.bak)。
# 这里换成最小可用版本:纯 VGA、无串口,只做 daemon-reload + 启用 linux-tty@tty1。
systemctl daemon-reload 2>/dev/null || true
if [ -x /usr/local/sbin/linux-tty ]; then
    if systemctl enable linux-tty@tty1.service >/dev/null 2>&1; then
        echo ">>> linux-tty@tty1 enabled"
    else
        echo ">>> WARNING: enable linux-tty@tty1 failed"
    fi
    echo ">>> linux-tty: $(ls -l /usr/local/sbin/linux-tty | awk '{print $1, $5}')"
else
    echo ">>> WARNING: /usr/local/sbin/linux-tty not found"
fi
%end



# 说明:内核由 anaconda 正常安装 —— anaconda 的 _select_kernel_package() 会取仓库里
#  **版本最高的 kernel**。所以:
#   · 不传 --kernel-rpm  → 仓库里只有官方 3.10,就装 3.10;
#   · 传了 --kernel-rpm  → 注入内核成为版本最高的 kernel,**并且** %packages 里还显式写了
#     "kernel-3.x.*"(由 build.sh 填),于是官方内核也留下来 ⇒ 双内核并存。
# ★ 但 %packages 里的 grubby 必须保留:内核包自身不依赖 grubby,而 anaconda 收尾会用
#   new-kernel-pkg(属于 grubby)重建 initramfs;缺了它安装会在最后
#   "Generating initramfs" 一步直接失败(踩过)。


%post  --log=/var/log/ks-post-default-kernel.log
# ============ 兜底:确保默认启动项是"已安装内核里版本最高的那个" ============
# 双内核(官方 3.10 + 可选注入的 5.4)时,默认必须落在高版本内核上;
# 只装了官方内核时,这里就选它自己 —— 所以不写死版本号。
# 直接写 grubenv:实测 grubby --set-default 在 grub2 下"返回成功但不生效"。
K=${K:-$(ls /boot/vmlinuz-* 2>/dev/null | sed 's|.*/vmlinuz-||' | sort -V | tail -1)}
[ -n "$K" ] || { echo "WARN: no /boot/vmlinuz-* found, skip default-kernel fix"; exit 0; }
echo "[default-kernel] target kernel = $K"

set_grub_default() {
	_cfg=$1
	_env=$2
	[ -f "$_cfg" ] || return 0
	_idx=$(awk -v k="vmlinuz-$K" '
		/^[[:space:]]*menuentry[[:space:]]/ { n++ }
		n && index($0, k) && !f { f = n }
		END { if (f) print f - 1 }' "$_cfg")
	[ -n "$_idx" ] || return 0
	[ -d "$(dirname "$_env")" ] && /usr/bin/grub2-editenv "$_env" set "saved_entry=$_idx" >/dev/null 2>&1
	[ -x /usr/sbin/grub2-set-default ] && /usr/sbin/grub2-set-default "$_idx" >/dev/null 2>&1
	echo "  $_cfg  ->  saved_entry=$_idx"
}

echo "Setting grub default entry to $K ..."
set_grub_default /boot/grub2/grub.cfg  /boot/grub2/grubenv
set_grub_default /boot/efi/EFI/centos/grub.cfg /boot/efi/EFI/centos/grubenv

echo "--- grub menu ---"
grep -n "^menuentry" /boot/grub2/grub.cfg 2>/dev/null
for _e in /boot/grub2/grubenv /boot/efi/EFI/centos/grubenv; do
	[ -f "$_e" ] && echo "  $_e : $(/usr/bin/grub2-editenv "$_e" list 2>/dev/null | grep '^saved_entry=')"
done

_dk=""
[ -x /usr/sbin/grubby ] && _dk=$(/usr/sbin/grubby --default-kernel 2>/dev/null)
case "$_dk" in
	*/vmlinuz-$K) echo "OK: default kernel = $K" ;;
	*)  echo "WARN: could not confirm default kernel $K (grubby said: $_dk); check menuentry / saved_entry above" ;;
esac

# ============ 保险:/root 必须干净 ============
# 现场硬要求:安装完成后 /root 下只允许 disk.sh / test.sh / ip.sh(+ 标准点文件)。
# 注意顺序:anaconda 在 **%post 之后** 才写 /root/anaconda-ks.cfg
#  (install.py:runPostScripts() 在前,_writeKS() 在后),所以这里的 rm 只是兜底;
#  真正拦住它的是内核参数 inst.nosave=all_ks(isolinux.cfg / EFI grub.cfg 已加),
#  再加 rc.local 里的首启兜底。
# ---- /root cleanup begin ----
install -d -m 700 /var/backups/ifcfg
# 上一版把 ifcfg 备份放在 /root/ifcfg-backup:挪到 /var/backups/ifcfg,再把旧目录删掉
if [ -d /root/ifcfg-backup ]; then
	mv -f /root/ifcfg-backup/* /var/backups/ifcfg/ 2>/dev/null
	rmdir /root/ifcfg-backup 2>/dev/null
fi
rm -f  /root/anaconda-ks.cfg /root/original-ks.cfg /root/initial-setup-ks.cfg
rm -f  /root/install.log /root/install.log.syslog
rm -f  /root/ks-pre.log /root/ks-post*.log /root/ks-*.log
rm -f  /root/TRANS.TBL /tmp/TRANS.TBL /TRANS.TBL
rm -rf /root/fio
# ---- /root cleanup end ----
chmod 0755 /root/disk.sh /root/test.sh /root/ip.sh 2>/dev/null
for _f in disk.sh test.sh ip.sh; do
	[ -f "/root/$_f" ] || echo "!!! /root/$_f is MISSING"
done
echo "--- final /root contents (only disk.sh/test.sh/ip.sh + standard dotfiles) ---"
ls -A /root
%end

%post --log=/var/log/ks-post-smartmontools.log
# ---------------------------------------------------------------------------
# smartmontools 离线安装(随 ISO 载荷 files/tmp/*.rpm 拷入本机 /tmp)
#   用于查看 NVMe/SATA 硬盘健康度与寿命:smartctl -a /dev/nvme0 / /dev/sda
#   注意:本段必须早于 ks-post-raidtools(那段会 rm -f /tmp/*.rpm)
# ---------------------------------------------------------------------------
cd /tmp
# 注意:①必须"一个事务"装完所有包,让 rpm 自己解依赖顺序;
#       ②mailx 是 smartmontools 的硬依赖(RPM 里写死的),不装就装不上;
#         装它不会产生任何告警——告警靠 smartd 服务,我们不启用。
#   (历史坑:①逐个 rpm -ivh 且依赖排后 → 缺 libcap-ng.so.0;②用 -ivh 时若 libcap-ng 已安装,
#    rpm 会以 "already installed" 中止整个事务 → mailx/smartmontools 全不装。故改用 -Uvh)
ok=0
_smt_rpms=""
for r in libcap-ng-*.rpm mailx-*.rpm smartmontools-*.rpm; do
    [ -f "$r" ] && _smt_rpms="$_smt_rpms $r"
done
if [ -n "$_smt_rpms" ]; then
    if rpm -q smartmontools >/dev/null 2>&1; then
        echo ">>> already installed: $(rpm -q smartmontools)"
    else
        echo ">>> rpm -Uvh --replacepkgs$_smt_rpms"
        # shellcheck disable=SC2086
        rpm -Uvh --replacepkgs $_smt_rpms 2>&1 | sed 's/^/    /'
        if rpm -q smartmontools >/dev/null 2>&1; then
            echo ">>> OK: $(rpm -q smartmontools) installed"
        else
            echo ">>> ERROR: smartmontools install FAILED"
        fi
    fi
    ok=1
fi
if [ "$ok" = "1" ]; then
    echo ">>> smartmontools: $(rpm -q smartmontools 2>&1)"
    echo ">>> smartctl: $(/usr/sbin/smartctl -V 2>/dev/null | head -1)"
    echo ">>> NVMe devices: $(ls /dev/nvme[0-9] 2>/dev/null | tr '\n' ' ')"
    # smartmontools 包的 %post 会执行 systemctl preset smartd.service ⇒ 默认 enabled+active。
    # 现场只要"查看寿命",不要告警 ⇒ 显式停用(disable 足够,mask 会妨碍以后手工启用)。
    systemctl disable --now smartd.service >/dev/null 2>&1 || true
    echo ">>> smartd: $(systemctl is-enabled smartd.service 2>&1) / $(systemctl is-active smartd.service 2>&1) (expect disabled/inactive)"
    echo ">>> smartctl ready: $(command -v smartctl || echo /usr/sbin/smartctl)"
else
    echo ">>> WARNING: smartmontools rpm not found in /tmp"
fi
rm -f /tmp/smartmontools-*.rpm /tmp/libcap-ng-*.rpm /tmp/mailx-*.rpm
%end

%post --log=/var/log/ks-post-raidtools.log
# ---------------------------------------------------------------------------
# 离线安装 RAID 管理工具:Dell perccli / 通用 storcli(LSI/Broadcom)/ HPE ssacli
# 三者均为厂商签名,盘内无对应 key,而安装源是 gpgcheck=1 → 走"本地文件 rpm -ivh"绕开
cd /tmp  # 关键:anaconda 的 %post 默认 cwd=/root,perccli/storcli 会往 cwd 写 <name>.log,统一丢到 /tmp 再清掉
installed=""
for R in /tmp/perccli-*.rpm /tmp/storcli-*.rpm /tmp/ssacli-*.rpm; do
  [ -f "$R" ] || continue
  echo ">>> rpm -ivh $R"
  rpm -ivh "$R" 2>&1 | tail -2
  installed="$installed $(basename "$R")"
done
# 这两个包的清单里有不带 64 的名字,实测磁盘上可能缺;补软链(缺则建,建了无害)
[ -x /opt/MegaRAID/perccli/perccli64 ] && ln -sf /opt/MegaRAID/perccli/perccli64 /opt/MegaRAID/perccli/perccli
[ -x /opt/MegaRAID/storcli/storcli64 ] && ln -sf /opt/MegaRAID/storcli/storcli64 /opt/MegaRAID/storcli/storcli
# 它们默认不在 PATH,给现场留个方便入口
[ -x /opt/MegaRAID/perccli/perccli64 ] && ln -sf /opt/MegaRAID/perccli/perccli64 /usr/local/bin/perccli64
[ -x /opt/MegaRAID/storcli/storcli64 ] && ln -sf /opt/MegaRAID/storcli/storcli64 /usr/local/bin/storcli64
echo ">>> installed:${installed:- none}"
for p in perccli storcli ssacli; do
  if rpm -q "$p" >/dev/null 2>&1; then
  printf ">>> %-8s %s | rpm -V: %s\n" "$p" "$(rpm -q "$p")" "$(rpm -V "$p" 2>&1 | tr '\n' ' ')"
  else
  printf ">>> %-8s not installed\n" "$p"
  fi
done
echo ">>> perccli64: $(/opt/MegaRAID/perccli/perccli64 -v 2>&1 | sed -n 2p)"
echo ">>> storcli64: $(/opt/MegaRAID/storcli/storcli64 -v 2>&1 | sed -n 2p)"
echo ">>> ssacli  : $(/usr/sbin/ssacli version 2>&1 | sed -n 2p)"
rm -f /tmp/perccli-*.rpm /tmp/storcli-*.rpm /tmp/ssacli-*.rpm && echo ">>> RPM files removed"
# 兜底:厂商 %post 可能已往 /root 写了日志,确保 /root 干净(只允许 disk.sh/ip.sh/test.sh + 点文件)
rm -f /root/storcli.log /root/perccli.log /root/ssacli.log /root/*.log 2>/dev/null
rm -f /tmp/storcli.log /tmp/perccli.log /tmp/ssacli.log /storcli.log /perccli.log /ssacli.log 2>/dev/null
echo ">>> /root: $(ls -A /root | tr '\n' ' ')"
%end


%post --log=/var/log/ks-post-grub-cmdline.log
# ===========================================================================
# 固定内核命令行,防止 yum update 换内核时被改动:
#  1) /etc/default/grub 的 GRUB_CMDLINE_LINUX 是 grub2-mkconfig 的唯一数据源,
#  内核包升级时 new-kernel-pkg/grubby 会读它 -> 只要这里写好,参数就不会丢;
#  2) BIOS 与 UEFI 两套 grub.cfg 都要重建(路径按发行版略有差异,逐个探测);
#  3) 最后用 grubby 给现有全部内核条目兜底追加,双保险。
# ===========================================================================
cd /
ARGS='nomodeset console=tty0 crashkernel=128M rhgb quiet'
# GRUB 启动等待时间:现场要求 1 秒跳过(默认 5 秒)
# ① 写进 /etc/default/grub(以后任何 grub2-mkconfig 重建也保持 1 秒)
# ② 直接 sed 现成的 grub.cfg(BIOS 与 UEFI 两份都改),不重建、不碰其它内容

GRUBF=/etc/default/grub
if [ -f "$GRUBF" ]; then
  cp -a "$GRUBF" "$GRUBF.bak.$(date +%s)" 2>/dev/null
  if grep -q '^GRUB_CMDLINE_LINUX=' "$GRUBF"; then
  sed -i "s|^GRUB_CMDLINE_LINUX=.*|GRUB_CMDLINE_LINUX=\"$ARGS\"|" "$GRUBF"
  else
  echo "GRUB_CMDLINE_LINUX=\"$ARGS\"" >> "$GRUBF"
  fi
  # 避免被 GRUB_CMDLINE_LINUX_DEFAULT(部分发行版)覆盖
  if grep -q '^GRUB_CMDLINE_LINUX_DEFAULT=' "$GRUBF"; then
  sed -i "s|^GRUB_CMDLINE_LINUX_DEFAULT=.*|GRUB_CMDLINE_LINUX_DEFAULT=\"$ARGS\"|" "$GRUBF"
  fi
  echo ">>> $GRUBF:"
  grep -E '^GRUB_CMDLINE_LINUX' "$GRUBF" | sed 's/^/  /'
else
 echo ">>> WARNING: $GRUBF not found, skipped"
fi
# BIOS + UEFI 两套 grub.cfg(以及各家 EFI 目录名)逐个重建
if [ -x /usr/sbin/grub2-mkconfig ]; then
  for f in /boot/grub2/grub.cfg /boot/efi/EFI/centos/grub.cfg \
  /boot/efi/EFI/redhat/grub.cfg /boot/efi/EFI/rocky/grub.cfg \
  /boot/efi/EFI/BOOT/grub.cfg; do
  if [ -f "$f" ]; then
: # [按原版对齐] 不再重建 grub.cfg,交给 anaconda / 内核升级流程(原命令: /usr/sbin/grub2-mkconfig …) -o "$f" >/dev/null 2>&1 && echo ">>> rebuilt: $f" || echo ">>> rebuild FAILED: $f"
  fi
  done
else
 echo ">>> WARNING: grub2-mkconfig not found"
fi
# 兜底:即便上面没生效,也用 grubby 给所有内核条目补参数
# ---- GRUB 超时 = 1 秒 ----
if [ -f "$GRUBF" ]; then
    if grep -q '^GRUB_TIMEOUT=' "$GRUBF"; then
        sed -i 's/^GRUB_TIMEOUT=.*/GRUB_TIMEOUT=1/' "$GRUBF"
    else
        echo 'GRUB_TIMEOUT=1' >> "$GRUBF"
    fi
    if grep -q '^GRUB_TIMEOUT_STYLE=' "$GRUBF"; then
        sed -i 's/^GRUB_TIMEOUT_STYLE=.*/GRUB_TIMEOUT_STYLE=menu/' "$GRUBF"
    else
        echo 'GRUB_TIMEOUT_STYLE=menu' >> "$GRUBF"
    fi
    echo ">>> $GRUBF: $(grep -E '^GRUB_TIMEOUT' "$GRUBF" | tr '\n' ' ')"
fi
# ⚠ 关键:anaconda 可能在 %post 之后才生成/覆盖 grub.cfg(那样我们上面的 sed 会被冲掉)。
#   所以这里先用 grub2-mkconfig 按我们写好的 /etc/default/grub 重建一次,再用 sed 兜底。
if [ -x /usr/sbin/grub2-mkconfig ]; then
    for o in /boot/grub2/grub.cfg /boot/efi/EFI/centos/grub.cfg; do
        [ -f "$o" ] || continue
        /usr/sbin/grub2-mkconfig -o "$o" >/dev/null 2>&1 \
            && echo ">>> regenerated: $o  ($(grep -m1 '^[[:space:]]*set timeout=' "$o" 2>/dev/null))" \
            || echo ">>> WARNING: grub2-mkconfig failed for $o"
    done
else
    echo ">>> WARNING: grub2-mkconfig not found"
fi
for f in /boot/grub2/grub.cfg /boot/efi/EFI/centos/grub.cfg /boot/efi/EFI/redhat/grub.cfg \
         /boot/efi/EFI/rocky/grub.cfg /boot/efi/EFI/BOOT/grub.cfg; do
    if [ -f "$f" ]; then
        before=$(grep -m1 '^[[:space:]]*set timeout=' "$f" 2>/dev/null)
        sed -i 's/^[[:space:]]*set timeout=.*/set timeout=1/' "$f" 2>/dev/null
        echo ">>> $f: $before -> $(grep -m1 '^[[:space:]]*set timeout=' "$f" 2>/dev/null)"
    fi
done
if [ -x /usr/sbin/grubby ]; then
  /usr/sbin/grubby --update-kernel=ALL --args="$ARGS" >/dev/null 2>&1 && echo ">>> grubby --update-kernel=ALL 已执行"
fi
# 打印实际生效的条目(取值核对)
for f in /boot/grub2/grub.cfg /boot/efi/EFI/centos/grub.cfg; do
  [ -f "$f" ] && { echo ">>> $f 中的启动行:"; grep -m2 -oE 'vmlinuz[^ ]* .*' "$f" 2>/dev/null | head -2 | sed 's/^/  /'; }
done

# anaconda 会把 %post 的退出码记成 "Error code 1";本段末尾的 [ -f ] 测试
# 可能返回 1,显式 exit 0 收尾,避免误报。
exit 0
%end

%post --log=/var/log/ks-post-repos.log
# ===========================================================================
# 安装后 yum 源:只保 CentOS 7,全部走华为云 Vault;内核固定在捆绑的
# kernel-5.4.119-19.0009.3.tl2,不再从任何源更新(用 /etc/yum.conf exclude 锁死)
# ---------------------------------------------------------------------------
# 关键:CentOS-Base.repo 属于 centos-release 包,删掉会在 yum update 升级该包时
# 被重新装回来(mirrorlist.centos.org 已下线 -> Cannot find a valid baseurl)。
# 它是 %config(noreplace):自己写一份后,后续升级不会覆盖。故直接覆盖为华为源,
# 仓库 ID 保持 [base]/[updates]/[extras],并且**不再创建** huawei-centos7.repo
# (否则同一 ID 出现两次,会报 "listed more than once")。
# ===========================================================================
cd /
rm -f /etc/yum.repos.d/huawei-centos7.repo /etc/yum.repos.d/tlinux-tkernel4.repo

cat > /etc/yum.repos.d/CentOS-Base.repo <<'HWREPO'
[base]
name=CentOS-7.9.2009 - Base - Huawei Cloud
baseurl=https://mirrors.huaweicloud.com/centos-vault/7.9.2009/os/$basearch/
gpgcheck=1
gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-CentOS-7
skip_if_unavailable=1
enabled=1

[updates]
name=CentOS-7.9.2009 - Updates - Huawei Cloud
baseurl=https://mirrors.huaweicloud.com/centos-vault/7.9.2009/updates/$basearch/
gpgcheck=1
gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-CentOS-7
skip_if_unavailable=1
enabled=1

[extras]
name=CentOS-7.9.2009 - Extras - Huawei Cloud
baseurl=https://mirrors.huaweicloud.com/centos-vault/7.9.2009/extras/$basearch/
gpgcheck=1
gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-CentOS-7
skip_if_unavailable=1
enabled=1

[centosplus]
name=CentOS-7.9.2009 - Plus - Huawei Cloud
baseurl=https://mirrors.huaweicloud.com/centos-vault/7.9.2009/centosplus/$basearch/
gpgcheck=1
gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-CentOS-7
skip_if_unavailable=1
enabled=0
HWREPO

cat > /etc/yum.repos.d/huawei-epel7.repo <<'EPELREPO'
[epel]
name=EPEL 7 - Huawei Cloud
baseurl=https://mirrors.huaweicloud.com/epel/7/$basearch/
gpgcheck=1
gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-EPEL-7
skip_if_unavailable=1
enabled=1
EPELREPO

# 其余 CentOS-*.repo 里 enabled=1 的仓库(如 centos-kernel)一律关掉
for f in /etc/yum.repos.d/CentOS-*.repo; do
  [ "$(basename "$f")" = "CentOS-Base.repo" ] && continue
  sed -i 's/^enabled=1/enabled=0/' "$f" 2>/dev/null
done

# 内核锁死:不允许任何源改动内核系包
EX='kernel kernel-core kernel-devel kernel-headers kernel-tools kernel-tools-libs python-perf kmod kmod-libs dracut dracut-config-generic dracut-config-rescue dracut-network kexec-tools'
if grep -q '^exclude=' /etc/yum.conf 2>/dev/null; then
  sed -i "s|^exclude=.*|exclude=$EX|" /etc/yum.conf
else
  echo "exclude=$EX" >> /etc/yum.conf
fi

yum clean all >/dev/null 2>&1
echo ">>> repo files: $(ls /etc/yum.repos.d/*.repo 2>/dev/null | xargs -r -n1 basename | tr '\n' ' ')"
echo ">>> enabled repos: $(grep -h -A3 '^enabled=1' /etc/yum.repos.d/CentOS-Base.repo /etc/yum.repos.d/huawei-epel7.repo 2>/dev/null | grep '^\[' | sort -u | tr '\n' ' ')"
echo ">>> duplicate repo IDs (should be empty): $(grep -h '^\[' /etc/yum.repos.d/*.repo 2>/dev/null | sort | uniq -d | tr '\n' ' ')"
echo ">>> yum.conf: $(grep '^exclude=' /etc/yum.conf)"
echo ">>> kernel: $(rpm -q kernel 2>/dev/null)"
%end

%post --log=/var/log/ks-post-chrony.log
# ---------------------------------------------------------------------------
# chrony:替换为国内 NTP 源(默认 *.centos.pool.ntp.org 在国内常"在跑但不同步")
# ---------------------------------------------------------------------------
if [ -f /etc/chrony.conf ]; then
    cp -a /etc/chrony.conf /etc/chrony.conf.bak.$(date +%s) 2>/dev/null
    sed -i '/^server /d;/^pool /d' /etc/chrony.conf
    cat >> /etc/chrony.conf <<'EOF'
server ntp.aliyun.com iburst
server ntp.tencent.com iburst
server cn.pool.ntp.org iburst
EOF
    echo ">>> chrony servers: $(grep -E '^(server|pool)' /etc/chrony.conf | tr '\n' ' ')"
else
    echo ">>> WARNING: /etc/chrony.conf not found"
fi
%end

# __ETH0_POST_BEGIN__
# (build.sh --no-eth0 会把 BEGIN/END 之间的这一段整段注释掉)
%post --log=/var/log/ks-post-eth0.log
# ---------------------------------------------------------------------------
# 把"当前 UP 的网卡"改名为 eth0(多个 UP 时取第一个),逻辑与现场要求一致:
#   1) 遍历 /sys/class/net,跳过 lo,找 operstate == up 的第一个网卡;
#   2) 记下它的 MAC,写 udev 规则(按 MAC 精确绑定 NAME="eth0"),不改名其它网卡;
#   3) 把装好的 ifcfg-<原网卡名> 改成 ifcfg-eth0(DEVICE=eth0 + HWADDR=MAC),
#      避免重启后 NetworkManager 找不到原网卡而断网;
#   4) 找不到 UP 的网卡就不动(不猜、不兜底)。
# 说明:不使用 net.ifnames=0 —— 那会把"所有"网卡都变成 eth0/eth1…,与"只改 UP 那张"不同。
# ---------------------------------------------------------------------------
ETH0_MAC=""
ETH0_OLD=""
# 0) manual (Select) install: the operator-chosen NIC has priority
if [ -s /run/.iface ]; then
    _want=$(tr -d ' \t\r\n' < /run/.iface)
    if [ -n "$_want" ] && [ -d "/sys/class/net/$_want" ]; then
        ETH0_OLD="$_want"
        ETH0_MAC=$(cat /sys/class/net/$_want/address 2>/dev/null)
        echo ">>> manual selection wins: $_want mac=$ETH0_MAC (-> eth0)"
    else
        echo ">>> /run/.iface=${_want:-empty} not usable, fall back to auto-pick"
    fi
fi
# 1) first NIC with operstate=up (skipped if manual choice already set)
for n in $(ls /sys/class/net 2>/dev/null | grep -v '^lo$'); do
    [ -n "$ETH0_MAC" ] && break
    st=$(cat /sys/class/net/$n/operstate 2>/dev/null)
    if [ "$st" = "up" ]; then
        ETH0_OLD="$n"
        ETH0_MAC=$(cat /sys/class/net/$n/address 2>/dev/null)
        break
    fi
done

# fallback A: no link at all => pick first NIC whose DRIVER is a 10G-class driver
# (speed is unreadable (-1) when the fiber is not plugged, so speed alone is unreliable)
if [ -z "$ETH0_MAC" ]; then
    for n in $(ls /sys/class/net 2>/dev/null | grep -v '^lo$'); do
        drv=$(basename "$(readlink -f /sys/class/net/$n/device/driver 2>/dev/null)" 2>/dev/null)
        case "$drv" in
            ixgbe|ixgbevf|i40e|i40evf|ice|iavf|igb|mlx4_en|mlx5_core|bnxt_en|be2net|cxgb4|qede|sfc|nfp|txgbe|ngbe)
                ETH0_OLD="$n"; ETH0_MAC=$(cat /sys/class/net/$n/address 2>/dev/null)
                echo ">>> fallback(by driver): $n drv=$drv mac=$ETH0_MAC"; DRVHIT=1; break ;;
        esac
    done
fi

# fallback: if no NIC is up, pick the first physical NIC with speed >= 10000 Mb/s (10G)
if [ -z "$ETH0_MAC" ]; then
    echo ">>> no NIC is up; falling back to first NIC with speed >= 10000 Mb/s"
    for n in $(ls /sys/class/net 2>/dev/null | grep -v '^lo$'); do
        sp=$(cat /sys/class/net/$n/speed 2>/dev/null)
        case "$sp" in ''|*[!0-9-]*) continue ;; esac
        [ "$sp" -ge 10000 ] 2>/dev/null || continue
        ETH0_OLD="$n"
        ETH0_MAC=$(cat /sys/class/net/$n/address 2>/dev/null)
        echo ">>> fallback selected: $n speed=${sp}Mb/s mac=$ETH0_MAC"
        break
    done
fi

if [ -n "$ETH0_MAC" ] && [ -n "$ETH0_OLD" ]; then
    echo ">>> selected NIC: $ETH0_OLD  mac=$ETH0_MAC  (-> eth0)"
    mkdir -p /etc/udev/rules.d
    cat > /etc/udev/rules.d/70-persistent-net.rules <<RULE
# 由 kickstart 生成:把当前 UP 的物理网卡固定命名成 eth0(按 MAC 精确匹配)
SUBSYSTEM=="net", ACTION=="add", DRIVERS=="?*", ATTR{address}=="$ETH0_MAC", ATTR{type}=="1", NAME="eth0"
RULE
    # 双保险:systemd .link 文件(按 MAC 绑定 eth0)+ udev NAME= 规则(CentOS 7 真正生效的那个)
    mkdir -p /etc/systemd/network
    cat > /etc/systemd/network/10-eth0.link <<LINK
[Match]
MACAddress=$ETH0_MAC
[Link]
Name=eth0
LINK
    echo ">>> /etc/systemd/network/10-eth0.link:"; cat /etc/systemd/network/10-eth0.link
    echo ">>> /etc/udev/rules.d/70-persistent-net.rules:"; cat /etc/udev/rules.d/70-persistent-net.rules

    # 把该网卡的 ifcfg 改名并指向 eth0(保留原 IP/DHCP 配置)
    if [ -f "/etc/sysconfig/network-scripts/ifcfg-$ETH0_OLD" ]; then
        cp -f "/etc/sysconfig/network-scripts/ifcfg-$ETH0_OLD" "/etc/sysconfig/network-scripts/ifcfg-eth0"
        sed -i "s/^DEVICE=.*/DEVICE=eth0/" "/etc/sysconfig/network-scripts/ifcfg-eth0"
        # NM 的连接名取自 NAME=/文件名;不同步会留下旧网卡名(如 ens192)
        if grep -q '^NAME=' "/etc/sysconfig/network-scripts/ifcfg-eth0"; then
            sed -i 's/^NAME=.*/NAME="eth0"/' "/etc/sysconfig/network-scripts/ifcfg-eth0"
        else
            echo 'NAME="eth0"' >> "/etc/sysconfig/network-scripts/ifcfg-eth0"
        fi
        # 删掉旧 UUID,让 NM 重建,避免与旧连接冲突
        sed -i '/^UUID=/d' "/etc/sysconfig/network-scripts/ifcfg-eth0"
        # 防止 DHCP 覆盖我们设的 DNS
        if grep -q '^PEERDNS=' "/etc/sysconfig/network-scripts/ifcfg-eth0"; then
            sed -i 's/^PEERDNS=.*/PEERDNS=no/' "/etc/sysconfig/network-scripts/ifcfg-eth0"
        else
            echo 'PEERDNS=no' >> "/etc/sysconfig/network-scripts/ifcfg-eth0"
        fi
        grep -q '^HWADDR=' "/etc/sysconfig/network-scripts/ifcfg-eth0" \
            && sed -i "s/^HWADDR=.*/HWADDR=$ETH0_MAC/" "/etc/sysconfig/network-scripts/ifcfg-eth0" \
            || echo "HWADDR=$ETH0_MAC" >> "/etc/sysconfig/network-scripts/ifcfg-eth0"
        # 原文件改名保留(冗余但更稳:NM 不会同时看到两个 DEVICE)
        # 关键:备份必须移出 /etc/sysconfig/network-scripts —— 该目录下任何 ifcfg-* 都会被
        # network.service 当成网卡配置去启动,残留 ifcfg-xxx.bak-rename 会导致 network.service 失败。
        # 备份必须移出 network-scripts(否则 network.service 会去起假网卡),
        # 也不能放 /root(该目录只允许三个脚本) ⇒ 统一放 /var/backups/
        mkdir -p /var/backups
        mv -f "/etc/sysconfig/network-scripts/ifcfg-$ETH0_OLD" \
              "/var/backups/ifcfg-$ETH0_OLD.bak-rename" 2>/dev/null || true
        ls /etc/sysconfig/network-scripts/ | grep -E '^ifcfg-' | tr '\n' ' '; echo
        echo ">>> ifcfg renamed -> ifcfg-eth0:"; cat "/etc/sysconfig/network-scripts/ifcfg-eth0"
    else
        echo ">>> WARNING: ifcfg-$ETH0_OLD not found (anaconda 可能没为它写配置)"
    fi

    # 让 NetworkManager / network 用新名字(重启后生效)
    echo ">>> existing net-scripts:"; ls /etc/sysconfig/network-scripts/ | grep -E '^ifcfg-' | tr '\n' ' '; echo
else
    echo ">>> WARNING: no up NIC and no NIC with speed >= 10000 Mb/s; no rename done (manual check needed)"
fi
%end
# __ETH0_POST_END__

%post --log=/var/log/ks-post-baseline.log
# ---------------------------------------------------------------------------
# 借鉴 fengcloud 的 baseline 做法(只改配置,不启服务;幂等):
#   sshd:UseDNS no / GSSAPIAuthentication no(登录与 scp 明显变快)
#   firstboot 自愈服务:首启体检 + 生成 /var/log/edge-install-report.txt
# ---------------------------------------------------------------------------
SSHD=/etc/ssh/sshd_config
if [ -f "$SSHD" ]; then
    cp -a "$SSHD" "/var/backups/sshd_config.bak-$(date +%s)" 2>/dev/null || mkdir -p /var/backups && cp -a "$SSHD" "/var/backups/sshd_config.bak-$(date +%s)" 2>/dev/null || true
    grep -qiE '^[[:space:]]*UseDNS[[:space:]]' "$SSHD" \
        && sed -i -E 's/^[[:space:]]*#?[[:space:]]*UseDNS[[:space:]]+.*/UseDNS no/' "$SSHD" \
        || sed -i '1i UseDNS no' "$SSHD"
    grep -qiE '^[[:space:]]*GSSAPIAuthentication[[:space:]]' "$SSHD" \
        && sed -i -E 's/^[[:space:]]*#?[[:space:]]*GSSAPIAuthentication[[:space:]]+.*/GSSAPIAuthentication no/' "$SSHD" \
        || sed -i '1i GSSAPIAuthentication no' "$SSHD"
    echo ">>> sshd tuned: $(grep -iE '^(UseDNS|GSSAPIAuthentication)' "$SSHD" | tr '\n' ' ')"
fi
if [ -x /usr/local/sbin/edge-firstboot.sh ]; then
    chmod 0755 /usr/local/sbin/edge-firstboot.sh /usr/local/bin/check 2>/dev/null || true
    systemctl daemon-reload 2>/dev/null || true
    systemctl enable edge-firstboot.service >/dev/null 2>&1 || true
    echo ">>> edge-firstboot: $(systemctl is-enabled edge-firstboot.service 2>&1)"
fi
%end
