# ============================================================================
#  UEFI/grub2 菜单(build.sh 会把 __LABEL__ 换成实际光盘卷标)
#  ★ 这份文件会被同时写进 isolinux 树和 images/efiboot.img 内部
#    (UEFI 真正读的是 efiboot.img 里那一份,build.sh 会自动同步)
#  grub2 没有 "菜单标题" 功能,所以第 0 项是一个不可执行的标题占位项,
#  真正的默认项是第 1 项 Auto Install(set default="1")。
# ============================================================================
set default="1"
set timeout=30
set timeout_style=menu
set color_normal=light-gray/black
set color_highlight=black/light-gray

insmod all_video

function load_video {
  insmod efi_gop
  insmod efi_uga
  insmod video_bochs
  insmod video_cirrus
  insmod all_video
}

load_video
set gfxpayload=keep
insmod gzio
insmod part_gpt
insmod ext2

search --no-floppy --set=root -l '__LABEL__'

menuentry '__MENU_TITLE__' --class gnu-linux --class gnu --class os {
	true
}

menuentry '   Auto Install (zero-touch)' --class fedora --class gnu-linux --class gnu --class os {
	linuxefi /images/pxeboot/vmlinuz inst.stage2=hd:LABEL=__LABEL__ inst.ks=hd:LABEL=__LABEL__:/isolinux/ks.cfg  auto inst.gpt  rd.lvm=0  rd.md=0 rd.dm=0 inst.nosave=all_ks
	initrdefi /images/pxeboot/initrd.img
}

menuentry '   Select Install (manual: network + disk)' --class fedora --class gnu-linux --class gnu --class os {
	linuxefi /images/pxeboot/vmlinuz inst.stage2=hd:LABEL=__LABEL__ inst.ks=hd:LABEL=__LABEL__:/isolinux/ks.cfg  static inst.gpt  rd.lvm=0  rd.md=0 rd.dm=0 console=tty0 inst.nosave=all_ks
	initrdefi /images/pxeboot/initrd.img
}
